name: "Chaos Suite Validation CI"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Steady State Script
        run: python3 scripts/verify-steady-state.py

